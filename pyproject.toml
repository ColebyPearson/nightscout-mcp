[project]
name = "nightscout-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Nightscout — lets LLMs read glucose, treatments, and analytics from a personal Nightscout instance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Coleby Pearson", email = "coleby.pr.pearson@gmail.com" }]
keywords = ["mcp", "nightscout", "diabetes", "cgm", "claude", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.4",
]

[project.scripts]
nightscout-mcp = "nightscout_mcp.server:main"

[project.urls]
# Set once the GitHub repo exists:
# Homepage = "https://github.com/<user>/nightscout-mcp"
# Issues = "https://github.com/<user>/nightscout-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightscout_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
